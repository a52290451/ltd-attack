id: MACRO-LTD-FINAL
status: FROZEN_DEV_ARCHITECTURE

source_model:
  id: MACRO-LTD-V2
  file: configs/models/MACRO-LTD-V2.yaml

purpose: >
  Final frozen Macro/longitudinal architecture selected entirely on DEV.
  No further Macro architecture search is permitted before holdout evaluation.
  This component will next be paired with a clean temporal Micro model.

features:
  id: MACRO-V2-BASE-128
  count: 128
  file: configs/features/MACRO-V2-BASE-128.txt

base_classifier:
  type: XGBoost
  n_estimators: 120
  max_depth: 5
  learning_rate: 0.10
  min_child_weight: 1
  subsample: 0.80
  colsample_bytree: 0.80
  reg_lambda: 1.0
  random_state: 42

longitudinal:
  model: LTDPairScorer
  context_days: 5
  temporal_encoding: sinusoidal_ordinal
  seeds:
    - 11
    - 42
    - 73
  ensemble: mean_softmax_probability

fusion:
  type: weighted_geometric_probability
  alpha: 0.375

dev_reference:
  fold_b:
    accuracy: 0.7979954979097438
    macro_f1: 0.783428885514458
    top5_accuracy: 0.9693429092078465
    mrr: 0.8701053324025053

selection_history:
  context_7_to_5:
    result: positive
  hard_confidence_gate:
    result: rejected
  query_age_encoding:
    result: rejected
  stale_context_training:
    result: rejected

freeze_policy:
  architecture_frozen: true
  additional_macro_architecture_search: false
  final_all_dev_refit_pending: false

holdout_policy:
  internal_test_opened: true
  future_b_opened: false
