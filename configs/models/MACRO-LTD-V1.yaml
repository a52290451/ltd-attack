id: MACRO-LTD-V1
status: FROZEN_DEV

purpose: >
  Frozen Macro/longitudinal milestone. It is the immutable reference
  for continued Macro research (MACRO-LTD-V2+) and for later integration
  with the Micro packet-sequence representation.

features:
  id: MACRO-V2-BASE-128
  count: 128
  file: configs/features/MACRO-V2-BASE-128.txt

base_classifier:
  type: XGBoost
  n_estimators: 120
  max_depth: 5
  learning_rate: 0.10
  min_child_weight: 1
  subsample: 0.80
  colsample_bytree: 0.80
  reg_lambda: 1.0
  random_state: 42

longitudinal:
  model: LTDPairScorer
  context_days: 7
  seeds:
    - 11
    - 42
    - 73
  ensemble: mean_softmax_probability

fusion:
  type: weighted_geometric_probability
  alpha: 0.375
  formula: "(1-alpha)*log(P_XGB) + alpha*log(P_LTD)"

development_protocol:
  alpha_selected_on: DEV_EARLY_TO_MIDDLE
  temporal_transfer_checked_on: DEV_EARLY_MIDDLE_TO_LATE
  robustness_gate_passed: true

holdout_policy:
  internal_test_opened: false
  future_b_opened: false
  note: >
    Holdouts remain closed. MACRO-LTD-V1 is a frozen development milestone,
    not necessarily the final Macro architecture. Further Macro variants
    may be developed on DEV without modifying V1. INTERNAL_TEST and Future-B
    remain reserved for later frozen candidates and final hybrid evaluation.
