name: Original SOTA static contracts
on:
  push:
    branches:
      - feature/macro-v2-historical-only
    paths:
      - "scripts/sota/**"
      - ".github/workflows/original-sota-static-contracts.yml"
  workflow_dispatch:
jobs:
  static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout LTD-Attack
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only test dependency
        run: python -m pip install "numpy==2.1.3"
      - name: Compile original SOTA scripts and run stage/metric tests
        run: |
          python scripts/sota/test_original_sota_contract_v1.py
          bash -n scripts/sota/run_original_sota_battery_v1.sh
      - name: Check source reference integrity (no downloads)
        run: |
          git diff --exit-code
          echo "CPU_STATIC_ONLY_NO_TRAINING"
